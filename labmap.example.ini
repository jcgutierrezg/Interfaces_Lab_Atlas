; Copy this file to labmap.ini (same folder) and set where your data lives.
; labmap.ini is personal: it's in .gitignore, so it never goes to GitHub.
;
; folder = the folder holding lab-data.xlsx, with rooms\, shapes\, sops\ and photos\ beside it.
; A Teams channel synced to OneDrive usually looks like the example below: in File Explorer, open the folder,
; click the address bar and copy the path. %USERPROFILE% and ~ work too. The generated files (report,
; layout, directory, backups) go to a build\ folder inside it.

[data]
folder = %USERPROFILE%\Your Organisation\Lab Team - Documents\Lab Atlas
