<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  EXAMPLE shape profile (1 unit = 1 cm): a 90 x 90 cm corner unit with a 45-degree front, used by BENCH-10
  in LAB-B. Its back edges sit against two walls (top and left); the diagonal is the front.
  The clearance is drawn explicitly because "clear_front" can't describe a diagonal front on this shape.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="190cm" height="190cm" viewBox="-20 -20 190 190">
  <title>corner-45 profile</title>
  <path d="M -15,-15 H 165 M -15,-15 V 165" stroke="#b8b8b8" stroke-width="6" fill="none"/>
  <path id="footprint" d="M 0,0 H 90 V 60 L 60,90 H 0 Z" fill="#9dc3e6" stroke="#1f4e79" stroke-width="0.8"/>
  <path id="clearance" d="M 90,60 L 146.6,116.6 L 116.6,146.6 L 60,90 Z" fill="none" stroke="#c00000"
        stroke-width="0.8" stroke-dasharray="4 3"/>
  <g id="notes" font-family="sans-serif" font-size="6.5">
    <circle cx="0" cy="0" r="1.8" fill="#c00000"/>
    <text x="150" y="-6" text-anchor="end" fill="#7f7f7f">wall</text>
    <text x="-6" y="150" fill="#7f7f7f" transform="rotate(-90 -6 150)">wall</text>
    <text x="38" y="42" text-anchor="middle" fill="#1f4e79">footprint</text>
    <text x="38" y="50" text-anchor="middle" fill="#1f4e79" font-size="5.5">90 × 90</text>
    <text x="124" y="124" text-anchor="middle" fill="#c00000" transform="rotate(-45 124 124)">clearance 80</text>
  </g>
</svg>
